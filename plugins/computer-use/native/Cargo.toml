[package]
name = "computer-use-helper"
version = "0.0.1"
edition = "2021"

[dependencies]
base64 = "0.22"
enigo = "0.6"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xcap = "0.9"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_UI_HiDpi"] }

[profile.release]
strip = true
